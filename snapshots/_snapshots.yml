version: 2

snapshots:
  - name: snap_movies
    description: >
      SCD Type 2 history of movie metadata, taken against the raw source rather
      than against dim_movies. Captures title corrections, genre
      reclassifications and hard deletes.
    tests:
      # The custom generic test written for this project. dbt maintains the
      # dbt_valid_from / dbt_valid_to columns but never checks that the result is
      # coherent, and the ways it can go wrong -- a non-deterministic source
      # query, an unstable unique_key -- are all silent.
      #
      # Both relaxations are here because this snapshot uses
      # hard_deletes='invalidate':
      #
      #   allow_closed_entities  a withdrawn title correctly ends with zero open
      #                          versions rather than exactly one
      #
      #   allow_gaps             a title that was withdrawn and later reinstated
      #                          correctly has a gap between its windows. It did
      #                          not exist during that interval, and a history
      #                          that closed the gap would be claiming it did
      #
      # Neither is relaxed anywhere else. On a snapshot without hard deletes both
      # conditions are real defects -- a missing open version means current state
      # has been lost, a gap means history has.
      - no_overlapping_versions:
          arguments:
            entity_key: movie_id
            allow_closed_entities: true
            allow_gaps: true
    columns:
      - name: movie_id
        description: Natural key of the versioned entity.
        tests:
          - not_null
      - name: title
        description: Versioned. A change here opens a new record.
      - name: genres
        description: Versioned. A change here opens a new record.
      - name: dbt_scd_id
        description: Surrogate key, one per version.
        tests:
          - unique
          - not_null
      - name: dbt_valid_from
        tests:
          - not_null
      - name: dbt_valid_to
        description: Null on the current version. Set on supersession or hard delete.
